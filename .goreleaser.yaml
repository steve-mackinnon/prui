version: 2
project_name: prui

builds:
  - main: ./cmd/prui
    binary: prui
    env:
      - CGO_ENABLED=0
    goos: [darwin, linux]
    goarch: [amd64, arm64]
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.commit={{.Commit}}

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md
      - CHANGELOG.md
      - docs/REFERENCE.md
      - docs/RELEASING.md

checksum:
  name_template: checksums.txt

changelog:
  disable: true

release:
  github:
    owner: steve-mackinnon
    name: prui
  prerelease: auto

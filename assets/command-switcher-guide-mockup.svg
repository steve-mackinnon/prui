<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Command switcher guide view</title>
  <desc id="desc">A terminal review UI with a compact PR switcher in the header, guide hierarchy on the left, and a guide diff on the right.</desc>
  <rect width="1200" height="620" fill="#101722"/>
  <g font-family="SFMono-Regular,Menlo,Consolas,monospace" font-size="22" fill="#e6eef9">
    <text x="28" y="45">review · </text><text x="142" y="45" fill="#8fe0a7">billing#42</text><text x="300" y="45" fill="#9eacc0"> · guide 1/3 · ⌘/ctrl+p to switch</text>
    <path d="M28 66H1172" stroke="#455166"/>
    <text x="28" y="108" fill="#f1c86b">GUIDES</text>
    <rect x="24" y="124" width="370" height="35" rx="4" fill="#2b4e7f"/>
    <text x="35" y="150">› 1 Receipt generation</text>
    <text x="62" y="187" fill="#b2bed0">· PDF rendering</text>
    <text x="62" y="224" fill="#b2bed0">· Export tests</text>
    <text x="35" y="268">2 API billing events</text>
    <text x="35" y="305">3 Documentation</text>
    <text x="28" y="560" fill="#9eacc0">]/[: guide · enter: diff</text>
    <path d="M420 92V575" stroke="#455166"/>
    <text x="452" y="125" fill="#8fe0a7">Receipt generation</text>
    <text x="452" y="158" fill="#9eacc0">Changes that build and test PDF receipts.</text>
    <path d="M452 178H1158" stroke="#455166"/>
    <text x="452" y="220">diff --git a/internal/export/pdf.go</text>
    <text x="452" y="258" fill="#8fe0a7">+ func renderReceipt(order Order) []byte</text>
    <text x="452" y="296" fill="#8fe0a7">+   return template.Execute(order)</text>
    <text x="452" y="350">diff --git a/internal/export/pdf_test.go</text>
    <text x="452" y="388" fill="#8fe0a7">+ func TestReceiptIncludesTotals(t *testing.T)</text>
    <text x="28" y="600" fill="#9eacc0">⌘/ctrl+p: switch PR · G: file plan · i: full inventory · ?: help</text>
  </g>
</svg>
